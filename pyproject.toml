[project]
name = "taxifare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Carl Spannuth", email = "carl.spannuth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.47.0",
    "matplotlib>=3.11.2",
    "pandas<3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
taxifare = "taxifare:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
